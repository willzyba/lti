<!DOCTYPE html>
<!--
  A preview of the LTI 1.3 tool outside an LMS: the page an instructor sees after launching it
  (views/launch.html, unchanged). The Node server's /config route is replaced by a stub that
  answers the way src/server.js does from its environment (EQNEDITOR_SERVER, EQNEDITOR_LICENCE,
  EQNEDITOR_DESIGN, EQNEDITOR_RENDER_URL), and the /insert form post - which would return the
  equation to the LMS as a Deep Linking response - shows the equation below instead.

  The tool's page is mounted into this one rather than a frame of its own: fxTeX Pro checks the
  licence against the page's address, and a frame written from here would have none.

  In a real deployment, run the server (npm start) with those variables set and register it
  with your LMS - see README.md. Replace the licence with your own fxTeX Pro licence key
  (fx_pk_...), from fxeditor.codecogs.com/login.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeCogs Equation Editor - LTI 1.3 preview</title>
    <style>
        body { margin: 0; background: #f5f5f5; font-family: -apple-system, "Segoe UI", Arial, sans-serif; color: #1c2530; }
        .lms { max-width: 900px; margin: 0 auto; padding: 16px; }
        .lms-bar { background: #394b58; color: #fff; padding: 10px 16px; font-size: 14px; border-radius: 4px 4px 0 0; }
        #tool { border: 1px solid #c7cdd1; border-top: 0; background: #fff; }
        .returned { margin-top: 16px; background: #fff; border: 1px solid #c7cdd1; border-radius: 4px; padding: 12px 16px; }
        .returned h2 { font-size: 14px; margin: 0 0 8px; color: #52606d; font-weight: 600; }
        .returned img { vertical-align: middle; margin: 4px 8px 4px 0; }
    </style>
</head>
<body>
    <div class="lms">
        <div class="lms-bar">Course editor &rsaquo; Insert content &rsaquo; CodeCogs Equation Editor</div>
        <div id="tool"></div>
        <div class="returned">
            <h2>Returned to the LMS</h2>
            <div id="returned">Nothing yet - build an equation above and press Insert.</div>
        </div>
    </div>

    <script>
        // What src/server.js's /config answers for a Deep Linking launch.
        var config = {
            isDeepLinking: true,
            server: '{{EQN_SERVER}}',
            renderUrl: 'https://latex.codecogs.com',
            licence: '{{FXTEXPRO_KEY}}',
            showLatex: false
        };

        // Stands in for /insert: the equation the LMS would receive as a Deep Linking item.
        function received( url, latex ) {
            var box = document.getElementById( 'returned' );
            if ( !box.querySelector( 'img' ) ) box.textContent = '';
            var img = document.createElement( 'img' );
            img.src = url;
            img.alt = latex;
            box.appendChild( img );
        }

        // The tool's server, as its page sees it: /config answered from `config` above, and the
        // /insert form post handed to received() instead of leaving the page.
        var realFetch = window.fetch;
        window.fetch = function ( url ) {
            if ( String( url ).indexOf( '/config' ) === 0 ) {
                return Promise.resolve( new Response( JSON.stringify( config ),
                    { headers: { 'Content-Type': 'application/json' } } ) );
            }
            return realFetch.apply( this, arguments );
        };
        HTMLFormElement.prototype.submit = function () {
            received( this.elements.url.value, this.elements.latex.value );
        };

        // launch.html, into #tool: its styles (with "body" meaning the tool), its markup, then its
        // scripts - recreated, since scripts parsed from a string never run.
        function mountPage( html, box ) {
            var page = new DOMParser().parseFromString( html, 'text/html' );
            page.querySelectorAll( 'style' ).forEach( function ( st ) {
                var style = document.createElement( 'style' );
                style.textContent = st.textContent.replace( /(^|[},\s])body(?=\s*[{,])/g, '$1#' + box.id );
                document.head.appendChild( style );
            } );
            Array.prototype.slice.call( page.body.childNodes ).forEach( function ( node ) {
                if ( node.nodeName !== 'SCRIPT' ) box.appendChild( document.importNode( node, true ) );
            } );
            page.body.querySelectorAll( 'script' ).forEach( function ( old ) {
                var script = document.createElement( 'script' );
                script.textContent = old.textContent;
                box.appendChild( script );
            } );
        }

        fetch( 'views/launch.html' )
            .then( function ( r ) { return r.text(); } )
            .then( function ( html ) { mountPage( html.replace( '__LTIK__', 'preview' ), document.getElementById( 'tool' ) ); } );
    </script>
</body>
</html>
